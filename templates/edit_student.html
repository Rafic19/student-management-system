<!DOCTYPE html>
<html>

<head>
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
   

    <div class="container">

        <h1>Edit Student</h1>

        <form method="POST">

            <label>Name:</label>
            <input type="text" name="name" value="{{ student[1] }}">
            <br><br>

            <label>Email:</label>
            <input type="email" name="email" value="{{ student[2] }}">
            <br><br>

            <label>Phone:</label>
            <input type="tel" name="phone" value="{{ student[3] }}">
            <br><br>

            <label>Course:</label>
            <input type="text" name="course" value="{{ student[4] }}">
            <br><br>

            <button type="submit">Update Student</button>

        </form>

    </div>

</body>

    




</html>
